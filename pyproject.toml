[project]
name = "langchain-updated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lavanya-Alapana", email = "you@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dataclasses>=0.8",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "langchain-tool>=0.1.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typing-extensions>=4.16.0",
]

[project.scripts]
langchain-updated = "langchain_updated:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
